[package]
name = "buttre-ffi"
version.workspace = true
edition = "2021"
description = "C ABI around EngineBridge for out-of-tree hosts (fcitx5 addon)"

[lib]
name = "buttre_ffi"
# cdylib: what the fcitx5 C++ addon dlopens/links; staticlib: lets the addon
# link statically instead if a distro build prefers a single .so.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
buttre-platform = { path = "../buttre-platform" }
