[package]
name = "buttre-ffi"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"
description = "C ABI around EngineBridge for out-of-tree hosts (fcitx5 addon)"
# Internal workspace crate — never published to crates.io. Also lets
# cargo-deny's [licenses.private] exempt this GPL-3.0-only crate from the
# third-party license allow-list check (see root deny.toml).
publish = false

[lib]
name = "buttre_ffi"
# cdylib: what the fcitx5 C++ addon dlopens/links; staticlib: lets the addon
# link statically instead if a distro build prefers a single .so.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
buttre-platform = { path = "../buttre-platform" }
buttre-core = { path = "../buttre-core" }
