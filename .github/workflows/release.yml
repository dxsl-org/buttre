name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix (e.g. 0.6.3-alpha)'
        required: true
        default: '0.7.0-beta'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked --version "^0.3"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI
        run: ./installers/windows/build_installer.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Rename MSI to standard filename
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Move-Item "target/wix/buttre-$v-x86_64.msi" "target/wix/buttre-$v-windows-x86_64.msi"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: buttre ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: target/wix/buttre-${{ steps.ver.outputs.version }}-windows-x86_64.msi
          body: |
            ## buttre v${{ steps.ver.outputs.version }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **Windows**: Run the MSI installer. SmartScreen may warn on first run (unsigned build) — click "More info → Run anyway".
            **Linux**: `sudo dpkg -i buttre-*-linux-x86_64.deb` (Debian/Ubuntu) or `sudo dnf install buttre-*-linux-x86_64.rpm` (Fedora/RHEL). Dùng fcitx5? Cài thêm `sudo dpkg -i fcitx5-buttre-*.deb` để có menu kiểu gõ ngay trên panel fcitx5 (Fedora: build addon từ source — xem addons/fcitx5-buttre).
            **macOS**: `buttre-*-macos-app.zip` is the Developer ID–signed, notarized `Buttre.app`: unzip, then `sudo ditto Buttre.app "/Library/Input Methods/Buttre.app"`, log out and back in, and add the buttre modes under System Settings → Keyboard → Input Sources → Vietnamese. `buttre-*-macos-universal.zip` is the bare engine dylib for developers.

  build-linux:
    name: Build Linux packages
    # Use ubuntu-22.04 (glibc 2.35) — ubuntu-latest is 24.04 (glibc 2.39), too new for Ubuntu 22.04 targets.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev libxi-dev libxtst-dev libxkbcommon-dev \
            libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxdo-dev \
            cmake extra-cmake-modules libfcitx5core-dev

      - name: Install packaging tools
        run: |
          cargo install cargo-deb --locked --version "^2.7"
          cargo install cargo-generate-rpm --locked --version "^0.14"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Clean stale cached artifacts
        run: |
          rm -f target/debian/*.deb
          rm -f target/generate-rpm/*.rpm

      - name: Build packages
        run: |
          chmod +x installers/linux/build_packages.sh \
                   installers/linux/debian/postinst \
                   installers/linux/debian/postrm
          ./installers/linux/build_packages.sh

      - name: Rename packages to standard filenames
        run: |
          V="${{ steps.ver.outputs.version }}"
          mv target/debian/buttre_*.deb "target/debian/buttre-${V}-linux-x86_64.deb"
          mv target/generate-rpm/buttre-*.rpm "target/generate-rpm/buttre-${V}-linux-x86_64.rpm"
          # The fcitx5 addon package is OPTIONAL (build_packages.sh warns
          # instead of failing) — rename only when it was produced.
          if ls target/debian/fcitx5-buttre_*.deb >/dev/null 2>&1; then
            mv target/debian/fcitx5-buttre_*.deb "target/debian/fcitx5-buttre-${V}-linux-x86_64.deb"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: buttre ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          # fcitx5-buttre is a glob on purpose: absent when the optional
          # addon build was skipped, and the release must still publish.
          files: |
            target/debian/buttre-${{ steps.ver.outputs.version }}-linux-x86_64.deb
            target/generate-rpm/buttre-${{ steps.ver.outputs.version }}-linux-x86_64.rpm
            target/debian/fcitx5-buttre-*.deb

  build-windows-hook:
    name: Build Windows hook ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build hook ZIP
        run: ./installers/windows/build_hook_zip.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: buttre ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: target/hook-zip/buttre-${{ steps.ver.outputs.version }}-windows-x86_64-hook.zip

  build-macos:
    name: Build macOS dylib artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build dylib zip
        run: |
          chmod +x installers/macos/build_dylib.sh
          ./installers/macos/build_dylib.sh ${{ steps.ver.outputs.version }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: buttre ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: target/macos/buttre-${{ steps.ver.outputs.version }}-macos-universal.zip

  # Signed + notarized IMKit host (Buttre.app). Needs the Apple secrets
  # (see hosts/macos/README.md "CI signing"); without them the job fails
  # instead of publishing an unsigned app macOS would refuse to load.
  build-macos-app:
    name: Build signed macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-app-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Import signing certificate + notary credentials
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see hosts/macos/README.md, CI signing)"
              exit 1
            fi
          done

          # Throwaway keychain: lives in RUNNER_TEMP, random password, gone
          # with the runner.
          KEYCHAIN="$RUNNER_TEMP/buttre-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign looks identities up through the user search list.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 holds no Developer ID Application identity with its private key"
            exit 1
          fi

          # Validates the App Store Connect API key against Apple before
          # the build spends any time.
          API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$API_KEY"
          xcrun notarytool store-credentials buttre-notary \
            --key "$API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --keychain "$KEYCHAIN"
          rm -f "$API_KEY"

          {
            echo "MACOS_SIGNING_IDENTITY=$IDENTITY"
            echo "MACOS_NOTARY_PROFILE=buttre-notary"
            echo "MACOS_NOTARY_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Build, sign and notarize Buttre.app
        run: bash hosts/macos/build_app.sh "${{ steps.ver.outputs.version }}"

      - name: Rename to release filename
        run: |
          V="${{ steps.ver.outputs.version }}"
          mv "target/macos-app/buttre-${V}-macos.zip" "target/macos-app/buttre-${V}-macos-app.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: buttre ${{ steps.ver.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: target/macos-app/buttre-${{ steps.ver.outputs.version }}-macos-app.zip

      - name: Delete signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/buttre-signing.keychain-db" || true
